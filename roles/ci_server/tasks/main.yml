-  name: Configure runner
   ansible.builtin.shell: >
     ./config.sh remove --token {{secrets.Github_Runner_Token}}
     ./config.sh --unattended
     --url https://github.com/awsdevops-sbs
     --token {{ secrets.Github_Runner_Token }}
   args:
     chdir: /home/ec2-user/github-runner
   become_user: ec2-user




-  name: Start Runner service
   ansible.builtin.shell: ./svc.sh install; ./svc.sh start
   args:
     chdir: /home/ec2-user/github-runner



-  name: Disable default Nodejs version
   ansible.builtin.shell: dnf module disable nodejs -y

-  name: Enable nodejs module for v20
   ansible.builtin.shell: dnf module enable nodejs:20 -y


-  name: Install NodeJS
   ansible.builtin.dnf:
     name: nodejs
     state: installed

-  name: Install Java
   ansible.builtin.dnf:
     name: java-17-openjdk
     state: installed

-  name: Download sonar scanner
   ansible.builtin.unarchive:
     src: https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-5.0.1.3006-linux.zip
     dest: /opt
     remote_src: yes

