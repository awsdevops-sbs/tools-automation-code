- name: Force Ansible to use Python 3.9
  ansible.builtin.set_fact:
    ansible_python_interpreter: /usr/bin/python3.9

- name: Set Prompt
  ansible.builtin.shell: set-prompt Artifactory

- name: Copy artifactory repo file
  ansible.builtin.template:
    src: jfrog.repo
    dest: /etc/yum.repos.d/jfrog-artifactory-rpms.repo

- name: Install artifactory
  ansible.builtin.dnf:
    name: jfrog-artifactory-oss
    state: installed
    disable_gpg_check: true

# ✅ ADD POSTGRESQL TASKS HERE ↓

- name: Install PostgreSQL
  ansible.builtin.dnf:
    name:
      - postgresql-server
      - python3-psycopg2
    state: installed

- name: Initialize PostgreSQL
  ansible.builtin.command: postgresql-setup --initdb
  args:
    creates: /var/lib/pgsql/data/PG_VERSION

- name: Start PostgreSQL
  ansible.builtin.systemd_service:
    name: postgresql
    state: started
    enabled: yes

- name: Create DB user and database
  ansible.builtin.shell: |
    sudo -u postgres psql -c "CREATE USER artifactory WITH PASSWORD 'artifactory';" || true
    sudo -u postgres psql -c "CREATE DATABASE artifactory OWNER artifactory;" || true

- name: Configure Artifactory to use PostgreSQL
  ansible.builtin.copy:
    dest: /opt/jfrog/artifactory/var/etc/system.yaml
    content: |
      shared:
        database:
          driver: org.postgresql.Driver
          type: postgresql
          url: "jdbc:postgresql://localhost:5432/artifactory"
          username: artifactory
          password: artifactory

# ✅ THEN START ARTIFACTORY ↓

- name: Start artifactory service
  ansible.builtin.systemd_service:
    state: started
    daemon_reload: true
    name: artifactory
    enabled: yes