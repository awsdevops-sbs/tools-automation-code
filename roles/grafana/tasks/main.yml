-  name: Force Ansible to use Python 3.9
   ansible.builtin.set_fact:
     ansible_python_interpreter: /usr/bin/python3.9

-  name: Set Prompt
   ansible.builtin.shell: set-prompt grafana


-  name: Copy grafana repo file
   ansible.builtin.template:
     src: grafana.repo
     dest: /etc/yum.repos.d/grafana.repo

-  name: Installed the grafana
   ansible.builtin.dnf:
     name: grafana
     state: installed

-  name: Copy datasource (pom-datasource.yml)
   ansible.builtin.template:
     src: pom-datasource.yml
     dest: /etc/grafana/provisioning/datasources/pom-datasource.yml

#-  name: Copy dashboard json file
#   ansible.builtin.template:
#     src: sample-dashboard.json
#     dest: /tmp/sample-dashboard.json



-  name: Create Grafana folder
   community.grafana.grafana_folder:
     grafana_url: "http://localhost:3000"
     grafana_user: "{{ secrets.grafana_user }}"
     grafana_password: "{{ secrets.grafana_password }}"
     org_id: 1
     title: "Project Dashboards"
     state: present




-  name: include task list in play
   ansible.builtin.include_tasks:
     file: import-tasks.yml
   loop:
     - caddy
     - node-exporter

-  name: Start grafana service
   ansible.builtin.systemd_service:
     state: started
     daemon_reload: true
     name: grafana-server
     enabled: yes